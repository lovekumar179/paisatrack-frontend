<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/paisatrack-favicon.svg"
            alt="App Logo"
            title="Paisa Track Favicon"
        />
        <title>PaisaTrack - My Books</title>
        <link rel="stylesheet" href="/css/global.css" />
        <link rel="stylesheet" href="/css/books.css" />
    </head>

    <body>
        <!-- App Header -->
        <header class="app-header">
            <div class="logo-container">
                <div class="app-logo">
                    <img src="/assets/paisatrack-favicon.svg" alt="app logo" />
                </div>

                <div class="app-text">
                    <span class="app-name">PaisaTrack</span>
                    <span class="app-tagline">Smart Expense Tracker</span>
                </div>
            </div>

            <a href="profile.html" title="My Profile">
                <div class="avatar">👤</div>
            </a>
        </header>
        
        <main>
            <!-- Page title and create book button -->
            <div class="page-title">
                <h1>My Books</h1>
                <a class="create-btn" href="create-book.html"
                    >Create New Book</a>
            </div>

            <!-- Books list -->
            <div class="books-list">
                <a class="book-box" href="dashboard.html">
                    <div class="book-detail">
                        <h2>Study Expense</h2>
                        <span>expense for study</span>
                    </div>
                    <div class="book-amount">
                        <span class="currency">PKR</span>
                        <span class="balance">12,500</span>
                    </div>
                </a>

                <a class="book-box" href="dashboard.html">
                    <div class="book-detail">
                        <h2>August pocket money</h2>
                        <span>pocket money expense</span>
                    </div>
                    <div class="book-amount">
                        <span class="currency">USD</span>
                        <span class="balance">1,240</span>
                    </div>
                </a>

                <a class="book-box" href="dashboard.html">
                    <div class="book-detail">
                        <h2>Fun book</h2>
                        <span>expense for Fun</span>
                    </div>
                    <div class="book-amount">
                        <span class="currency">PKR</span>
                        <span class="balance">-3,200</span>
                    </div>
                </a>
            </div>
        </main>
    </body>
</html>
