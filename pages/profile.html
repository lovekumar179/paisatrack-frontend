<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PaisaTrack - User Profile</title>
        <link rel="stylesheet" href="/css/global.css" />
        <link rel="stylesheet" href="/css/profile.css" />
    </head>
    <body>
        <main>
            <!-- profile container -->
        <div class="profile-container">
            <div class="card">
                <!-- Profile Header -->
                <div class="profile-header">
                    <div class="avatar-box">👤</div>
                    <h2 class="profile-title">User Profile</h2>
                    <h3 class="profile-name">Love Kumar</h3>
                    <p class="profile-email">love@paisatrack.com</p>
                </div>

                <!-- Buttons -->
                <div class="profile-actions">
                    <button class="btn-edit">Edit Avatar / Name</button>
                    <button class="btn-logout">Logout</button>
                    <button class="btn-delete">Delete My Account</button>
                </div>
            </div>
        </div>
        </main>
    </body>
</html>
