<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/paisatrack-favicon.svg"
        />
        <title>PaisaTrack - Login</title>
        <link rel="stylesheet" href="/css/global.css" />
    </head>
    <body>
        <main>
            <div class="card">
                <!-- Main Title -->
                <div class="main-title">
                    <h1>PaisaTrack - Login</h1>
                </div>

                <!-- Login form -->
                <form action="books.html" method="post">
                    <label for="email">EMAIL</label>
                    <input
                        class="inputBox"
                        type="email"
                        name="email"
                        id="email"
                        title="Enter valid email"
                        placeholder="e.g. demo@example.com"
                        autofocus
                        required
                    />
                    <label for="password">PASSWORD</label>
                    <input
                        class="inputBox"
                        type="password"
                        name="password"
                        id="password"
                        title="Enter strong password"
                        placeholder="At least 8 characters"
                        required
                    />
                    <!-- login button -->
                    <div class="login-btn">
                        <button id="login" type="submit" class="btn">
                            Login
                        </button>
                    </div>
                </form>

                <!-- link to Signup page -->
                <div class="auth-link">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </div>
            </div>
        </main>
    </body>
</html>
