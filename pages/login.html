<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PaisaTrack - Login</title>
        <link rel="stylesheet" href="/css/login.css" />
    </head>
    <body>
        <main>
            <div class="container">
                <!-- Main Title -->
                <div class="main-title">
                    <h1>PaisaTrack - Login</h1>
                </div>

                <!-- Login form  -->
                <form action="login.html" method="post">
                    <input
                        class="inputBox"
                        type="email"
                        name="email"
                        id="email"
                        title="Enter valid email"
                        placeholder="Email"
                        autofocus
                        required
                    />
                    <input
                        class="inputBox"
                        type="password"
                        name="password"
                        id="password"
                        title="Enter strong password"
                        placeholder="Password"
                        required
                    />
                    <!-- login button -->
                    <div class="login-btn">
                        <button id="login" type="submit">Login</button>
                    </div>
                </form>

                <!-- link to Signup page -->
                <div class="signup">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </div>
            </div>
        </main>
    </body>
</html>
