<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/assets/paisatrack-favicon.svg"
        />
        <title>PaisaTrack - Dashboard</title>
        <link rel="stylesheet" href="/css/global.css" />
        <link rel="stylesheet" href="/css/dashboard.css" />
    </head>
    <body>
        <!-- App header-->
        <header class="app-header">
            <div class="logo-container">
                <div class="app-logo">
                    <img src="/assets/paisatrack-favicon.svg" alt="app logo" />
                </div>

                <div class="app-text">
                    <span class="app-name">PaisaTrack</span>
                    <span class="app-tagline">Smart Expense Tracker</span>
                </div>
            </div>

            <a href="profile.html" title="My Profile">
                <div class="avatar">👤</div>
            </a>
        </header>


        <main>
            <!-- Book name and currency -->
            <div class="book-title">
                <h1>Study Expense</h1>
                <span class="currency">PKR</span>
            </div>

            <!-- Total balance -->
            <div class="balance-box">
                <span class="balance-label">TOTAL BALANCE</span>
                <span class="balance-amount">2000</span>
            </div>

            <!-- Cash In and Cash Out totals -->
            <div class="amount-row">
                <div class="amount-box">
                    <span class="amount-label">CASH IN</span>
                    <span class="amount-in">10000</span>
                </div>
                <div class="amount-box">
                    <span class="amount-label">CASH OUT</span>
                    <span class="amount-out">8000</span>
                </div>
            </div>

            <!-- Cash In and Cash Out buttons -->
            <div class="action-row">
                <a class="btn-cashin" href="transaction.html"
                    >+ Cash In</a
                >
                <a class="btn-cashout" href="transaction.html"
                    >- Cash Out</a
                >
            </div>

            <!-- Filter options-->
            <div class="filter-row">
                <button class="filter-btn active">Yearly</button>
                <button class="filter-btn">Monthly</button>
            </div>

            <!-- Transactions list -->
            <div class="transactions-list">

                <a class="transaction-box" href="edit">
                    <div class="transaction-detail">
                        <h2>OTHER</h2>
                        <span>full year study expense</span>
                    </div>
                    <span class="amount-in">+ 10000</span>
                </a>

                <a class="transaction-box" href="edit">
                    <div class="transaction-detail">
                        <h2>STATIONARY</h2>
                        <span>bought books</span>
                    </div>
                    <span class="amount-out">- 5000</span>
                </a>

                <a class="transaction-box" href="edit">
                    <div class="transaction-detail">
                        <h2>SCHOOL</h2>
                    </div>
                    <span class="amount-out">- 3000</span>
                </a>
            </div>
        </main>
    </body>
</html>
