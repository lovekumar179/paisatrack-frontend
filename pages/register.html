<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="assets/paisatrack-favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PaisaTrack - Register</title>
        <link rel="stylesheet" href="/css/global.css" />
        <link rel="stylesheet" href="/css/register.css" />
    </head>
    <body>
        <main>
            <!-- App title -->
            <div class="app-title">
                <h1>Paisa Track</h1>
                <span>Manage your money easily</span>
            </div>

            <div class="card">
                <!-- Signup Title -->
                <div class="main-title">
                    <h1>Register</h1>
                </div>

                <!-- Register form -->
                <form action="login.html" method="post">
                    <label for="fullname">FULLNAME</label>
                    <input
                        class="inputBox"
                        type="text"
                        name="fullname"
                        id="fullname"
                        title="Enter your full name"
                        placeholder="Full Name"
                        autofocus
                        required
                    />
                    <label for="email">EMAIL</label>
                    <input
                        class="inputBox"
                        type="email"
                        name="email"
                        id="email"
                        title="Enter valid email"
                        placeholder="e.g. demo@example.com"
                        required
                    />
                    <label for="password">PASSWORD</label>
                    <input
                        class="inputBox"
                        type="password"
                        name="password"
                        id="password"
                        title="Enter strong password"
                        placeholder="At least 8 characters"
                        required
                    />
                    <!-- register button -->
                    <div class="reg-btn">
                        <button id="register" type="submit" class="btn">Register</button>
                    </div>
                </form>

                <!-- link to login page -->
                <div class="auth-link login-page">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>
            </div>
        </main>
    </body>
</html>
