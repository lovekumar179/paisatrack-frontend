<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Circular Background in App Theme Dark Slate -->
  <rect width="512" height="512" rx="120" fill="#ffffff"/>
  
  <!-- Growth Arrow (Purple Accent #5346e0) -->
  <path d="M 100,380 L 220,220 L 290,290 L 380,140 L 310,140 L 380,140 L 380,210" fill="#7981a0" stroke="#5346e0" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow Head -->
  <path d="M 380,140 L 290,140 M 380,140 L 380,230" fill="none" stroke="#5346e0" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stack of Coins (Ice Blue #e3edf7 with Purple borders) -->
  <g transform="translate(230, 240)">
    <!-- Bottom Coin -->
    <ellipse cx="90" cy="130" rx="75" ry="30" fill="#e3edf7" stroke="#5346e0" stroke-width="14"/>
    <path d="M 15 130 Q 90 160 165 130" fill="none" stroke="#5346e0" stroke-width="14"/>

    <!-- Middle Coin -->
    <ellipse cx="90" cy="85" rx="75" ry="30" fill="#e3edf7" stroke="#5346e0" stroke-width="14"/>
    <path d="M 15 85 Q 90 115 165 85" fill="none" stroke="#5346e0" stroke-width="14"/>

    <!-- Top Coin -->
    <ellipse cx="90" cy="40" rx="75" ry="30" fill="#ffffff" stroke="#5346e0" stroke-width="14"/>
    <ellipse cx="90" cy="40" rx="45" ry="18" fill="none" stroke="#5346e0" stroke-width="8" stroke-dasharray="10 8"/>
  </g>
</svg>